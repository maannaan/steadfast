# Storyboard for the 5-minute demo video. Every scene has a fixed slot in the final cut;
# build_video.py speeds a longer clip up to fit it (and labels the speed), and fails if
# the narration does not fit. Slots add up to 4:55, under the 5:00 limit.
#
# visual types:
#   card    - a still: an image (docs/diagrams/*.png) with a title, rendered by Playwright
#   term    - a terminal capture made by demo/record.py, replayed by demo/term.html
#   console - a CloudWatch console capture made by demo/capture.py console
#
# record: the command demo/record.py runs for a term scene (from the repo root, after
# eval "$(scripts/aws_env.sh)"). start_at: replay from the first line matching this regex.
# {placeholders} in narration are filled from build_video.py --var name=value.

voice:
  model: model-weights/cpu/en_US-ljspeech-medium.onnx
  length_scale: 0.92 # a little faster than Piper's default pace

scenes:
  - id: title
    slot_s: 20
    visual:
      type: card
      title: "Steadfast: zero unaccounted calls"
      subtitle: "AI collections calls on AWS, open-weight models, every call accounted for"
      image: docs/diagrams/aws-architecture.png
    narration: >-
      This is Steadfast, a call service for AI collections calls to borrowers of Indian
      digital lenders. Its one rule: every call ends in the call log, or in the dead letter
      queue, and no call is ever lost. Everything here runs on AWS, from one Terraform
      stack, in the Asia Pacific region.

  - id: smoke
    slot_s: 20
    visual: {type: term, capture: smoke}
    record: scripts/aws_smoke.sh
    narration: >-
      First, the deployed stack. A request without the access key is refused at the load
      balancer, before any task sees it. With the key, one call goes through the
      orchestrator, is recorded in DynamoDB, and is read back, most likely by a different
      task. Smoke test passes.

  - id: load-dashboard
    slot_s: 36
    visual: {type: console, capture: load-dashboard}
    narration: >-
      Now a full morning campaign window replayed at speed: twenty five real minutes shown in
      under forty seconds. The mock pipeline injects transient faults on one turn in five,
      absorbed by exponential backoff and jitter. Watch the CloudWatch dashboard: as in-flight
      calls climb past twenty per task, target tracking automatically scales the Fargate
      service out from two to six tasks across multiple availability zones. Turn latency holds
      steady under one point five seconds, and once the morning peak subsides, tasks scale
      cleanly back down to baseline.

  - id: load-report
    slot_s: 11
    visual: {type: term, capture: load-window, start_at: "scenario"}
    record: scripts/load_aws.sh
    narration: >-
      Then the load generator checks every call it sent against the service. Each one is a
      result or a dead letter. Unaccounted: zero.

  - id: dlq-replay
    slot_s: 19
    visual: {type: term, capture: dlq-replay}
    record: scripts/replay_aws.sh
    narration: >-
      Calls that ran out of retries wait in an S Q S dead letter queue. The replay worker
      drains it at a fixed rate, behind the same circuit breaker, and only inside permitted
      calling hours. Replays are idempotent: a call replayed twice is still recorded once.

  - id: outage
    slot_s: 16
    visual: {type: term, capture: outage, start_at: "DEGRADED"}
    record: scripts/outage_aws.sh
    narration: >-
      A failure drill. Downstream latency spikes past the attempt timeout. Turns retry with
      backoff, slow calls are dead lettered instead of hanging the caller, and the per-turn
      CloudWatch latency alarm fires. Nothing is lost.

  - id: az-drill
    slot_s: 18
    visual: {type: term, capture: az-drill, start_at: "stopping every"}
    record: scripts/az_drill.sh
    narration: >-
      Next, a multi-availability zone failure drill. Every orchestrator task in zone A is
      terminated mid-load. In-flight calls drain cleanly, the remaining zone absorbs traffic
      with zero dropped calls, and E C S rebalances tasks automatically.

  - id: bluegreen
    slot_s: 18
    visual: {type: term, capture: bluegreen}
    record: scripts/bluegreen_demo.sh
    narration: >-
      Deploys are E C S native blue green. The new version answers test traffic on a header
      first, bakes for two minutes, then takes production. A broken version never gets
      production traffic: it fails readiness, and E C S rolls it back on its own.

  - id: models
    slot_s: 28
    visual: {type: term, capture: models}
    record: scripts/model_demo.sh
    narration: >-
      Then the open-weight models, on a C P U instance: faster whisper for speech to text,
      Qwen two point five for the reply, and Piper for speech. The orchestrator talks to
      them unchanged. With injected faults and a full queue, the model rejects work
      explicitly and logs why, and the orchestrator retries or dead letters. Still zero
      unaccounted. The voice you are hearing is that same Piper voice.

  - id: teardown
    slot_s: 18
    visual: {type: term, capture: teardown, start_at: "teardown finished|PASS|FAIL"}
    record: scripts/teardown.sh
    narration: >-
      At the end of every session, the entire stack is destroyed with Terraform, and an
      independent verification script queries AWS APIs across all resource types. Zero
      instances, zero gateways, zero residual cost. Teardown passes.

  - id: close
    slot_s: 13
    visual:
      type: card
      title: "Zero unaccounted calls"
      subtitle: "This session cost {session_cost} on AWS. Code, results, runbook: github.com/maannaan/steadfast (Apache-2.0)"
      image: docs/diagrams/call-flow.png
    narration: >-
      This entire session cost just {session_cost_spoken} on AWS. Full source code,
      architecture runbooks, and test results are on GitHub under Apache two point oh.
