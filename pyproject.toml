[project]
name = "steadfast-collections-agent"
version = "0.1.0"
description = "A resilient, model-agnostic runtime for compliant collections voice agents."
license = { text = "Apache-2.0" }
requires-python = ">=3.12"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = ["."]
